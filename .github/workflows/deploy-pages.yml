name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Resolve base path
        id: base
        run: |
          # The venue twin is always served from its custom domain at root.
          # Project site (username.github.io/repo) -> served from /repo/.
          # Override by setting the BASE_PATH repository variable.
          if [ -n "${{ vars.BASE_PATH }}" ]; then
            BASE="${{ vars.BASE_PATH }}"
          elif [ -n "${{ vars.VENUE_HOST }}" ]; then
            BASE="/"
          elif [[ "${{ github.repository }}" == *".github.io" ]]; then
            BASE="/"
          else
            BASE="/${{ github.event.repository.name }}/"
          fi
          echo "Using base path: $BASE"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - name: Guard against private data in the public build
        run: node scripts/check-public-data.mjs

      - name: Build static site
        env:
          BASE_PATH: ${{ steps.base.outputs.base }}
          STATIC_EXPORT: 1
          # Hostname of the plain-HTTP venue twin (see below). The app links to
          # it when it detects it cannot read the meeting-room server.
          VITE_VENUE_HOST: ${{ vars.VENUE_HOST || '3gpplive.net' }}
        run: bun run build

      - name: Locate and validate static app
        run: |
          if [ -f dist/client/index.html ]; then
            OUT=dist/client
          elif [ -f dist/index.html ]; then
            OUT=dist
          else
            echo "Static build did not produce an index.html" >&2
            exit 1
          fi

          # Never deploy source/Jekyll output by mistake. A valid Vite app entry
          # contains generated module assets; the README-rendered page does not.
          if ! grep -Eq '<script[^>]+type="module"|/assets/[^" ]+\.js' "$OUT/index.html"; then
            echo "Refusing to deploy: index.html is not the compiled RAN1 Live app" >&2
            exit 1
          fi
          if grep -q 'Jekyll SEO tag' "$OUT/index.html"; then
            echo "Refusing to deploy Jekyll/README output" >&2
            exit 1
          fi

          echo "OUT_DIR=$OUT" >> "$GITHUB_ENV"

      # Keep the custom-domain files inside the uploaded build artifact. The
      # repository root deliberately has no CNAME, so branch/Jekyll Pages cannot
      # claim the domain and render README.md instead of this app.
      - name: Configure venue domain
        run: |
          echo "${{ vars.VENUE_HOST || '3gpplive.net' }}" > "$OUT_DIR/CNAME"
          touch "$OUT_DIR/.nojekyll"

      - name: SPA fallback for client-side routes
        run: |
          cp "$OUT_DIR/index.html" "$OUT_DIR/404.html"

      - name: Guard built output
        run: node scripts/check-public-data.mjs "$OUT_DIR"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ env.OUT_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
