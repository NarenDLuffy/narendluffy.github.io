name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Resolve base path
        id: base
        run: |
          # Custom domain (CNAME present) or user/org site -> served from root.
          # Project site (username.github.io/repo) -> served from /repo/.
          # Override by setting the BASE_PATH repository variable.
          if [ -n "${{ vars.BASE_PATH }}" ]; then
            BASE="${{ vars.BASE_PATH }}"
          elif [ -f public/CNAME ] || [ -f CNAME ]; then
            BASE="/"
          elif [[ "${{ github.repository }}" == *".github.io" ]]; then
            BASE="/"
          else
            BASE="/${{ github.event.repository.name }}/"
          fi
          echo "Using base path: $BASE"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - name: Guard against private data in the public build
        run: node scripts/check-public-data.mjs

      - name: Build static site
        env:
          BASE_PATH: ${{ steps.base.outputs.base }}
        run: bun run build

      - name: SPA fallback for client-side routes
        run: |
          OUT=dist
          [ -d "$OUT/client" ] && OUT="$OUT/client"
          cp "$OUT/index.html" "$OUT/404.html" || true
          touch "$OUT/.nojekyll"
          echo "OUT_DIR=$OUT" >> "$GITHUB_ENV"

      - name: Guard built output
        run: node scripts/check-public-data.mjs "$OUT_DIR"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.OUT_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
