name: Track drafts

# Draft / FL summary tracking runs on its own schedule, deliberately separate
# from schedule ingestion: draft folders churn much faster during a meeting,
# and a slow or failing draft scan must never delay the timetable refresh.
# The pipeline itself decides which meetings are worth scanning (active first,
# upcoming lightly, completed archived), so no workflow edit is needed when the
# meeting rolls over.
on:
  schedule:
    # Meeting-week cadence: every 5 minutes across full session hours, so the
    # committed snapshot never drifts far behind the live Inbox.
    - cron: "*/5 3-21 * * 1-5"
    # Weekend and out-of-hours passes, offset from the schedule workflow.
    - cron: "42 * * * 0,6"
    - cron: "42 22,23,0,1,2 * * 1-5"
  workflow_dispatch:
    inputs:
      slug:
        description: "Scan only this meeting slug (e.g. ran1-126)"
        type: string
        required: false

concurrency:
  group: update-drafts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ingestion dependencies
        run: pip install -r ingestion/requirements.txt

      # The committed drafts.json is the state store: the previous snapshot is
      # what makes "new since last scan" possible, so the checkout above is all
      # the state this job needs.
      - name: Scan draft folders
        run: |
          python -m draft_tracker.update_drafts \
            ${{ inputs.slug && format('--slug {0}', inputs.slug) || '' }}

      - name: Commit draft index
        run: |
          if [ -n "$(git status --porcelain public/data)" ]; then
            git config user.name "ran1-live-bot"
            git config user.email "bot@users.noreply.github.com"
            git add public/data
            git commit -m "chore(drafts): refresh draft and FL summary index"
            # Scans overlap with other bots; rebase and retry instead of failing
            # and silently leaving the index stale.
            for attempt in 1 2 3; do
              if git push; then exit 0; fi
              git pull --rebase --autostash || true
              sleep 5
            done
            echo "Could not push the refreshed index" >&2
            exit 1
          else
            echo "No draft changes."
          fi
