name: Update schedule

# Event-aware refresh. The workflow itself never knows which meeting is
# current: the ingestion pipeline discovers that, and the cadence below simply
# covers "meeting week" hours densely and everything else sparsely. A meeting
# that starts, moves or ends therefore needs no workflow change.
on:
  schedule:
    # Meeting-week cadence: every 5 minutes, Mon-Fri, 05:00-19:00 UTC.
    - cron: "*/5 5-19 * * 1-5"
    # Between meetings / outside session hours: hourly, so a newly published
    # meeting folder or a pre-meeting schedule is picked up on its own.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force full schedule rebuild (ignore source hashes)"
        type: boolean
        default: false
      fixtures:
        description: "Publish the demonstration meetings instead of live documents"
        type: boolean
        default: false
      meeting:
        description: "Rebuild only this meeting (e.g. 126-bis); empty = all"
        type: string
        default: ""

concurrency:
  # Schedule and drafts jobs commit to the same branch: one queue, never in parallel.
  group: data-refresh
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"
  # Remote meeting FTP (same login every meeting); host comes from the app.
  MEETING_FTP_USER: ${{ secrets.MEETING_FTP_USER }}
  MEETING_FTP_PASS: ${{ secrets.MEETING_FTP_PASS }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ingestion dependencies
        run: pip install -r ingestion/requirements.txt

      - name: Restore source state cache
        uses: actions/cache@v5
        with:
          path: .ingestion-state
          key: ingestion-state-${{ github.run_id }}
          restore-keys: ingestion-state-

      # NOTE: hosted runners cannot reach the meeting-local source (10.10.10.10).
      # The public 3GPP source is always used here; meeting-local documents are
      # only ever read client-side by delegates on the venue network.
      - name: Discover meetings and refresh schedules
        id: refresh
        timeout-minutes: 45
        # A refused update still writes its status; commit it, then fail below.
        continue-on-error: true
        run: |
          python -m ingestion.generate_schedule \
            ${{ inputs.force && '--force' || '' }} \
            ${{ inputs.fixtures && '--fixtures' || '' }} \
            ${{ inputs.meeting && format('--meeting {0}', inputs.meeting) || '' }}

      # Pictures of the refused update's tables, for checking by eye only.
      - name: Picture the tables of a refused update
        if: steps.refresh.outcome == 'failure' && hashFiles('failed-schedule/**') != ''
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libreoffice-writer poppler-utils > /dev/null
          find failed-schedule -name '*.docx' -print0 | while IFS= read -r -d '' f; do
            soffice --headless --convert-to pdf --outdir "$(dirname "$f")" "$f" > /dev/null 2>&1 || true
            pdf="${f%.docx}.pdf"; [ -f "$pdf" ] && pdftoppm -png -r 110 "$pdf" "${f%.docx}-page"
          done

      - name: Upload refused-update pictures
        if: steps.refresh.outcome == 'failure' && hashFiles('failed-schedule/**') != ''
        uses: actions/upload-artifact@v5
        with:
          name: refused-schedule-${{ github.run_id }}
          path: failed-schedule/
          retention-days: 14

      - name: Commit updated data
        run: |
          if [ -n "$(git status --porcelain public/data)" ]; then
            git config user.name "ran1-live-bot"
            git config user.email "bot@users.noreply.github.com"
            git add public/data
            git commit -m "chore(data): refresh meetings and schedules from 3GPP sources"
            # Another bot may have pushed meanwhile; rebase and retry.
            # Drop any stray non-data edits so rebase can always run.
            git reset --hard HEAD
            git clean -fd -e .ingestion-state
            for attempt in 1 2 3 4 5; do
              if git push; then exit 0; fi
              if ! git pull --rebase -X theirs; then
                [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ] && git rebase --abort
              fi
              sleep $((attempt * 5))
            done
            echo "Could not push the refreshed schedule" >&2
            exit 1
          else
            echo "No schedule changes."
          fi

      - name: Fail when the update was refused
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "The timetable update was refused; the previous timetable is still published." >&2
          cat failed-schedule/*/errors.txt 2>/dev/null >&2 || true
          exit 1
